<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Getherclass</title><link rel="icon" id="fav">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#17386f;--org:#ff8a14;--ink:#12294f;--paper:#eef3fb;--card:#fff;--mute:#5d6f93;--line:#d8e1f2;--mint:#ff8a14;--pink:#ff8a14;
--blue:#3b9dff;--green:#2fd27f;--yellow:#ffc700;--orange:#ff7a00;--red:#ff3b47}
@media(prefers-color-scheme:dark){:root{--ink:#e8eefc;--paper:#0b1630;--card:#13244b;--mute:#9fb0d6;--line:#25396b;--navy:#0f2250}}
*{box-sizing:border-box}
body{margin:0;font-family:Anuphan,system-ui,sans-serif;background:radial-gradient(900px 400px at 85% -10%,#ff8a1424,transparent),var(--paper);color:var(--ink);line-height:1.6;min-height:100vh}
header{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;padding:10px 20px;background:linear-gradient(120deg,#17386f,#0f2a5c);color:#fff;border-bottom:4px solid var(--org);position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:center;gap:10px}.brand img{height:46px;width:46px;object-fit:contain;background:#fff;border-radius:14px;padding:3px}
.logo{font-size:1.5rem;font-weight:700;letter-spacing:-.02em}.logo b{color:var(--org)}
nav{display:flex;gap:6px;background:#ffffff1a;padding:4px;border-radius:99px}
button,.btn{font:inherit;font-weight:600;cursor:pointer;border:0;background:var(--navy);color:#fff;padding:7px 16px;border-radius:99px;text-decoration:none;display:inline-block;transition:transform .15s,box-shadow .15s}
button:hover,.btn:hover{transform:translateY(-1px);box-shadow:0 4px 14px #ff8a1450}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--org);outline-offset:2px}
nav button{background:transparent}nav button.on{background:var(--org);color:#fff}
header button:not(.on){background:#ffffff22}header .pri{background:var(--org)}
.pri{background:var(--org);color:#fff}.sm{padding:3px 12px;font-size:.85rem}
.dng{background:#ffe0e2;color:#9b1520}
main{max-width:980px;margin:0 auto;padding:20px 16px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:0 6px 24px #17386f14}
input,select,textarea{font:inherit;padding:8px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);max-width:100%}
textarea{width:100%;min-height:70px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.grow{flex:1;min-width:140px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}.grid label{display:grid;font-size:.85rem;color:var(--mute)}
h2{margin:6px 0 12px;font-size:1.6rem;letter-spacing:-.02em;color:var(--ink)}h3{margin:4px 0}
header+main h2::after{content:"";display:block;width:54px;height:5px;border-radius:9px;background:var(--org);margin-top:4px}
.chip{border-radius:99px;padding:4px 14px;font-size:.88rem;background:var(--paper);color:var(--ink);border:1.5px solid var(--line)}
.chip.on{background:var(--navy);color:#fff;border-color:var(--org)}
.hw{display:flex;gap:12px;border:2px solid var(--c);border-left-width:10px;box-shadow:0 0 14px color-mix(in srgb,var(--c) 55%,transparent),0 0 2px var(--c)}
.hw.red,.hw.o{animation:glow 1.8s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 30px var(--c),0 0 4px var(--c)}}
.hw .tag{background:var(--c);color:#fff;border-radius:99px;padding:2px 12px;font-size:.82rem;font-weight:700;white-space:nowrap;box-shadow:0 0 12px var(--c)}
.hw.o .tag,.hw.y .tag{color:#1b2a4a}
.blue{--c:var(--blue)}.green{--c:var(--green)}.y{--c:var(--yellow)}.o{--c:var(--orange)}.red{--c:var(--red)}
.meta{color:var(--mute);font-size:.88rem}
table{width:100%;border-collapse:collapse}th{color:var(--mute);font-weight:600;font-size:.85rem}th,td{padding:8px;border-bottom:1px solid var(--line);text-align:left}
.ok{color:var(--green);font-weight:700}.wait{color:var(--orange);font-weight:700}.bad{color:var(--red);font-weight:700}
.sum{display:flex;gap:10px;flex-wrap:wrap}.sum div{flex:1;min-width:120px;background:var(--paper);border-radius:14px;padding:10px 14px;border-bottom:3px solid var(--org)}.sum b{font-size:1.35rem;display:block}
#modal{position:fixed;inset:0;background:#06112acc;backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
#modal.show{display:flex}#modal>div{background:var(--card);border:2px solid var(--org);box-shadow:0 0 40px #ff8a1466;border-radius:24px;max-width:380px;padding:22px;text-align:center}
.mascot{font-size:4.5rem;animation:hop 1.2s ease-in-out infinite}
@keyframes hop{50%{transform:translateY(-12px) rotate(-6deg)}}
@media(prefers-reduced-motion:reduce){.mascot,.hw.red,.hw.o{animation:none}button:hover{transform:none}}
.hide{display:none!important}
button{white-space:nowrap}
@media(max-width:560px){header{padding:8px 12px}nav{width:100%}nav button{flex:1;padding:6px 4px;font-size:.9rem}.logo{font-size:1.3rem}.brand img{height:38px;width:38px}}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;border:2px solid var(--org);padding:8px 18px;border-radius:99px;display:none;z-index:10}

.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.dh{text-align:center;font-weight:700;color:#fff;border-radius:10px;padding:3px 0;background:var(--c);font-size:.85rem}
.dh.w1,.dh.w3{color:#1b2a4a}
.cd{min-height:88px;border:1.5px solid color-mix(in srgb,var(--c) 45%,var(--line));border-radius:12px;padding:4px 5px;cursor:pointer;background:color-mix(in srgb,var(--c) 9%,var(--card));font-size:.72rem;overflow:hidden;line-height:1.3}
.cd .n{font-weight:700;font-size:.95rem;color:var(--c)}.cd.w3 .n,.cd.w1 .n{color:var(--ink)}
.cd.td{outline:3px solid var(--org);outline-offset:1px}.cd.far{opacity:.4}
.cd.hol{border-color:var(--red);box-shadow:inset 0 0 10px #ff3b4730}
.off{display:block;color:var(--red);font-weight:700;text-shadow:0 0 6px var(--red),0 0 14px var(--red);animation:gt 1.8s ease-in-out infinite}
@keyframes gt{50%{text-shadow:0 0 14px var(--red),0 0 26px var(--red)}}
.ev{display:block;background:var(--navy);color:#fff;border-left:3px solid var(--org);border-radius:5px;padding:0 4px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.h{background:var(--red)}.hwd{color:var(--org);font-weight:700}
.det{text-align:left}.det .card{box-shadow:none;padding:10px}
@media(max-width:560px){.cd{min-height:58px;padding:3px}.ev{font-size:0;height:6px;width:6px;border-radius:99px;display:inline-block;padding:0;margin:1px;border:0}.off{font-size:.65rem}}
@media(prefers-reduced-motion:reduce){.off{animation:none}}

#modal>div{max-width:520px;width:100%;max-height:92vh;overflow:auto}
.hw{cursor:pointer}
.cd .ev{background:linear-gradient(135deg,#ffd75e,#f5b300);color:#2a1d00;font-weight:700;border:0;border-radius:6px;padding:1px 4px;margin-top:3px;white-space:normal;word-break:break-word;line-height:1.15;font-size:.68rem;height:auto;width:auto;display:block;box-shadow:0 0 8px #ffc933,0 0 16px #ffc93388}
.cd .ev.h{background:var(--red);color:#fff;box-shadow:0 0 8px var(--red)}
.cd.gold{border-color:#ffc933;box-shadow:0 0 10px #ffc933aa,inset 0 0 8px #ffc93344;animation:gold 2.4s ease-in-out infinite}
@keyframes gold{50%{box-shadow:0 0 22px #ffc933,inset 0 0 12px #ffc93366}}
@media(max-width:560px){.cd{min-height:80px}.cd .ev{font-size:.58rem;padding:1px 3px}}
.mem{display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap;border:2px solid var(--line);border-left-width:8px;border-radius:16px;padding:10px 12px;margin-bottom:8px;background:var(--card)}
.mem .mp{flex:1;min-width:150px}.mem .nm{font-weight:700;font-size:1.05rem}
.mem .st{font-weight:700;font-size:.85rem;border-radius:99px;padding:2px 12px;background:var(--c);color:#fff;white-space:nowrap}
.mem.paid{--c:var(--green);border-color:var(--green)}.mem.pending{--c:var(--orange);border-color:var(--orange)}.mem.wait{--c:#7b8bb0}
.mem.due,.mem.late{--c:var(--red);border-color:var(--red);box-shadow:0 0 14px #ff3b4788,0 0 2px var(--red)}
.mem.due .st,.mem.late .st{box-shadow:0 0 12px var(--red)}
.mem.late{animation:glow 1.8s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){.cd.gold,.mem.late{animation:none}}

.hw{align-items:center}
.hw .ck{width:36px;height:36px;border-radius:50%;padding:0;border:3px solid var(--c);background:transparent;color:#fff;font-size:1.2rem;font-weight:700;flex:none;box-shadow:none}
.hw .ck.on{background:var(--green);border-color:var(--green);box-shadow:0 0 12px var(--green)}
.hw .side{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.fin{--c:var(--green)}
.hw.fin{opacity:.7;box-shadow:0 0 8px #2fd27f55;animation:none}
.hw.fin h3{text-decoration:line-through;text-decoration-color:var(--green)}
.hw.fin .tag{background:var(--green);color:#fff}
.hw.pin{outline:2px solid #ffc933;outline-offset:3px;background:linear-gradient(135deg,color-mix(in srgb,#ffc933 16%,var(--card)),var(--card))}
.pinb{display:inline-block;background:linear-gradient(135deg,#ffd75e,#f5b300);color:#2a1d00;border-radius:99px;padding:0 10px;font-size:.78rem;font-weight:700;box-shadow:0 0 10px #ffc933;margin-right:6px;vertical-align:middle}
.prog{height:12px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:6px}
.prog>div{height:100%;background:linear-gradient(90deg,var(--green),#7af0b0);border-radius:99px;transition:width .4s}
@media(max-width:560px){.hw{flex-wrap:wrap}.hw .grow{flex:1 1 calc(100% - 60px)}.hw .side{flex-direction:row;align-items:center;justify-content:space-between;width:100%}}

.mem[data-debt]{cursor:pointer}.big{font-size:1.9rem!important}

body::before{content:"";position:fixed;left:-120px;bottom:-120px;width:380px;height:380px;border-radius:50%;background:radial-gradient(circle,#17386f26,transparent 70%);pointer-events:none;z-index:-1}
.card{transition:transform .2s,box-shadow .2s}
.card.hw:hover,.mem[data-debt]:hover{transform:translateY(-2px)}
.pri{background:linear-gradient(135deg,#ffa43a,#ff7a00);box-shadow:0 4px 12px #ff8a1450}
.ic{width:20px;height:20px;vertical-align:-4px;margin-right:6px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hero{display:flex;align-items:center;gap:14px;background:linear-gradient(120deg,#17386f,#2a58a8);color:#fff;border-radius:24px;padding:10px 20px;margin-bottom:16px;border-bottom:4px solid var(--org);position:relative;overflow:hidden;box-shadow:0 8px 28px #17386f40}
.hero::after{content:"";position:absolute;right:-34px;top:-34px;width:150px;height:150px;border-radius:50%;background:#ff8a1440}
.hero::before{content:"";position:absolute;right:70px;bottom:-40px;width:90px;height:90px;border-radius:50%;background:#ffffff14}
.hi{font-size:1.25rem;font-weight:700}.hm{flex:none;position:relative;z-index:1}
.enter>*{animation:rise .45s both}.enter>*:nth-child(2){animation-delay:.06s}.enter>*:nth-child(3){animation-delay:.12s}.enter>*:nth-child(4){animation-delay:.18s}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
.mc{overflow:visible;animation:bob 2.6s ease-in-out infinite}.mc-cheer{animation:jump .8s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}@keyframes jump{40%{transform:translateY(-12px)}}
.blink{transform-box:fill-box;transform-origin:center;animation:bl 4.5s infinite}@keyframes bl{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.tear{animation:tear 1.8s infinite}@keyframes tear{0%{transform:translateY(-3px);opacity:0}30%{opacity:1}100%{transform:translateY(12px);opacity:0}}
.spk{transform-box:fill-box;transform-origin:center;animation:tw 1.2s infinite}@keyframes tw{50%{transform:scale(.4) rotate(40deg);opacity:.5}}
.mascot{font-size:1rem;animation:none;display:flex;justify-content:center}
#ft{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 0 30px;color:var(--mute);font-size:.85rem}
@media(prefers-reduced-motion:reduce){.mc,.mc-cheer,.blink,.tear,.spk,.enter>*{animation:none}}


/* ===== Getherclass UI refresh: clearer hierarchy, responsive controls ===== */
:root{
  color-scheme:light;
  --navy:#17386f;--org:#f28b20;--ink:#172b4d;--paper:#f4f7fc;--card:#ffffff;
  --mute:#687994;--line:#dce5f1;--mint:#f28b20;--pink:#f28b20;
  --blue:#4389e8;--green:#20a878;--yellow:#e8ae17;--orange:#ed8b24;--red:#e25361;
}
@media(prefers-color-scheme:dark){:root{--ink:#172b4d;--paper:#f4f7fc;--card:#fff;--mute:#687994;--line:#dce5f1;--navy:#17386f}}
html{scroll-behavior:smooth}
body{background:linear-gradient(180deg,#edf3fc 0,#f7f9fd 280px,#f4f7fc 100%);color:var(--ink);line-height:1.65}
header{padding:12px clamp(12px,3vw,32px);gap:12px 20px;background:rgba(18,45,91,.97);border-bottom:3px solid var(--org);box-shadow:0 8px 28px #112d5b20;backdrop-filter:blur(14px)}
.brand{gap:12px;min-width:max-content}.brand img{height:44px;width:44px;border-radius:14px;box-shadow:0 3px 12px #071a3b35}.logo{font-size:1.42rem;letter-spacing:-.04em}.logo b{color:#ffb45f}
nav{gap:5px;padding:5px;background:#ffffff15;border:1px solid #ffffff1f;border-radius:16px}
nav button{display:flex;align-items:center;justify-content:center;gap:2px;padding:9px 15px;border-radius:12px;font-weight:600;transition:background .18s,color .18s,transform .18s}
nav button.on{background:#fff;color:var(--navy);box-shadow:0 3px 12px #06173526}
nav button:not(.on):hover{background:#ffffff20;box-shadow:none}
#who{justify-content:flex-end;gap:7px}#who .meta{color:#d6e1f5}#who button{border:1px solid #ffffff26}
main{max-width:1120px;padding:26px clamp(12px,2.8vw,28px) 64px}
h2{font-size:clamp(1.35rem,2.2vw,1.75rem);font-weight:700;letter-spacing:-.035em;margin:8px 0 16px}
header+main h2::after{width:42px;height:4px;margin-top:6px}
h3{font-size:1.08rem;line-height:1.4;margin:2px 0 8px;letter-spacing:-.015em}
.card{padding:clamp(14px,2vw,22px);margin-bottom:16px;border:1px solid #e0e8f4;border-radius:20px;box-shadow:0 5px 20px #1a37660a;transition:box-shadow .18s,border-color .18s,transform .18s}
.card:not(.hw):hover{box-shadow:0 8px 24px #1a376611;border-color:#d3deee}
.row{gap:9px}.grid{gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr))}
.grid label,label.meta{gap:5px;font-size:.9rem;font-weight:600;color:var(--mute)}
input,select,textarea{width:100%;min-height:43px;padding:10px 13px;border:1px solid #d7e1ef;border-radius:12px;background:#fff;color:#172b4d;box-shadow:0 1px 2px #17386f05;transition:border-color .18s,box-shadow .18s}
input::placeholder,textarea::placeholder{color:#9aa8bd}input:focus,select:focus,textarea:focus{border-color:#6a9ce8;box-shadow:0 0 0 4px #4389e81c;outline:none}
textarea{min-height:96px;resize:vertical}
button,.btn{min-height:39px;padding:8px 15px;border-radius:12px;background:#203f76;box-shadow:none;font-weight:650;transition:transform .16s,box-shadow .16s,background .16s}
button:hover,.btn:hover{transform:translateY(-1px);box-shadow:0 5px 14px #17386f1b}
button:active,.btn:active{transform:translateY(0)}
.pri{background:linear-gradient(135deg,#ffad50,#f28b20);color:#fff;box-shadow:0 4px 12px #f28b2030}
.pri:hover{box-shadow:0 7px 18px #f28b2040}.sm{min-height:32px;padding:5px 11px;font-size:.85rem;border-radius:10px}
.dng{background:#fff0f1;color:#bd3543;border:1px solid #f6cdd1}.chip{padding:6px 13px;background:#f6f8fc;border:1px solid #e0e7f1;color:#51627e;font-size:.86rem;transition:all .16s}
.chip:hover{background:#edf3fc;border-color:#bdcfe9;box-shadow:none;transform:none}.chip.on{background:#1b3c74;color:#fff;border-color:#1b3c74;box-shadow:0 3px 9px #17386f1b}
.hero{padding:18px 22px;margin-bottom:22px;border:1px solid #244b89;border-bottom:4px solid var(--org);border-radius:22px;background:linear-gradient(115deg,#17386f 0%,#24529a 68%,#2f65a9 100%);box-shadow:0 10px 26px #17386f20;min-height:112px}
.hero .hi{font-size:clamp(1.12rem,2vw,1.35rem);margin-bottom:2px}.hero>div:not(.hm){position:relative;z-index:1}.hero::after{background:#ffb45f22}
.sum{gap:12px}.sum div{min-width:145px;padding:15px 17px;background:linear-gradient(145deg,#f8faff,#f0f5fc);border:1px solid #e3ebf6;border-bottom:3px solid var(--org);border-radius:16px}.sum b{font-size:clamp(1.2rem,2.5vw,1.55rem);margin-top:3px;overflow-wrap:anywhere}
.prog{height:9px;background:#e5ebf4}.prog>div{background:linear-gradient(90deg,#23a979,#8bdab6)}
.hw{padding:16px 17px;gap:14px;border-width:1px 1px 1px 5px;border-radius:18px;box-shadow:0 4px 16px #172b4d0b;align-items:center}
.hw:hover{box-shadow:0 9px 22px #172b4d16!important;transform:translateY(-2px)}.hw .tag{padding:5px 11px;border-radius:10px;font-size:.82rem;box-shadow:none}.hw .ck{width:34px;height:34px;color:var(--green);border-width:2px;border-radius:11px;background:#fff;font-size:1.05rem}.hw .ck.on{color:#fff;background:var(--green);border-color:var(--green);box-shadow:none}.hw h3{font-size:1.02rem;margin:0 0 5px;overflow-wrap:anywhere}.hw .meta{line-height:1.55}.hw .side{gap:7px;min-width:max-content}.hw.red,.hw.o{animation:none}.hw.red{background:#fffafb}.hw.o{background:#fffdf8}.hw.fin{border-color:var(--green);background:#f8fcfa}.hw.pin{background:linear-gradient(110deg,#fff9e8,#fff);outline:1px solid #f1ce71;box-shadow:0 5px 18px #d4a12a13}
.pinb{box-shadow:none;padding:2px 8px}.meta{color:var(--mute)}
.cal{gap:7px}.dh{padding:7px 2px;border-radius:10px;font-size:.8rem}.cd{min-height:104px;padding:7px;border-radius:12px;background:color-mix(in srgb,var(--c) 5%,#fff);border:1px solid color-mix(in srgb,var(--c) 24%,var(--line));transition:transform .15s,box-shadow .15s}.cd:hover{transform:translateY(-1px);box-shadow:0 4px 12px #17386f12}.cd .n{font-size:1rem}.cd.td{outline:2px solid var(--org);outline-offset:1px}.cd .ev{font-size:.68rem;box-shadow:none;background:#fff0c2;color:#74520a;border:1px solid #f3df9e}.cd .ev.h{background:#ffe7e9;color:#b33443;border-color:#f4c5cb}.cd.gold{animation:none;box-shadow:inset 0 0 0 1px #f2cf6d}.off{text-shadow:none;animation:none;font-size:.68rem}
table{border-collapse:separate;border-spacing:0;overflow:hidden;border-radius:12px}th{background:#f4f7fc;color:#536782}th,td{padding:11px 12px;border-bottom:1px solid #e6edf6}tr:last-child td{border-bottom:0}td{overflow-wrap:anywhere}
.mem{padding:13px 15px;border-width:1px 1px 1px 5px;border-radius:15px;box-shadow:0 3px 12px #17386f08}.mem.due,.mem.late{box-shadow:0 4px 15px #e2536118;animation:none}.mem .st{padding:4px 10px;border-radius:9px}.mem .nm{font-size:1rem}
#modal{background:#0c1c36a8;backdrop-filter:blur(8px);padding:14px}#modal>div{border:1px solid #dce5f1;border-radius:24px;padding:clamp(18px,3vw,28px);box-shadow:0 24px 80px #071a3b35;max-width:600px;text-align:left}#modal h3{font-size:1.2rem;margin-bottom:10px}#modal .det>.row:last-child{flex-wrap:wrap}#modal .det>.row:last-child button{flex:0 1 auto}
#toast{bottom:20px;border:1px solid #ffffff25;border-radius:14px;padding:11px 18px;box-shadow:0 8px 24px #06173530;max-width:calc(100vw - 28px);text-align:center}

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,doc,setDoc,addDoc,deleteDoc,onSnapshot,getDoc,getDocs,writeBatch,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ====== 1) วาง firebaseConfig ของคุณตรงนี้ ====== */
const firebaseConfig = {
  apiKey: "AIzaSyB9nVrAp8fKGFBJkchQaaxy7WKM7GdzGnM",
  authDomain: "gatherclass-7.firebaseapp.com",
  projectId: "gatherclass-7",
  storageBucket: "gatherclass-7.firebasestorage.app",
  messagingSenderId: "114966364605",
  appId: "1:114966364605:web:0b827dd5008c18a3fc52d4"
};

const fb = initializeApp(firebaseConfig), auth = getAuth(fb), db = getFirestore(fb);
const S = {tab:"dash",debts:[],mf:"all",ev:[],cm:new Date(), user:null, student:JSON.parse(localStorage.getItem("gc_student")||"null"),
  hw:[], students:[], rounds:[], pays:[], ledger:[], courses:[], coursesLoaded:false, q:"", f:"all", moTab:"status", roundId:"", msearch:""};
const $ = s => document.querySelector(s);
// Theme preference is local to this device; it does not affect shared class data.
const themeKey="getherclass-theme";
function applyTheme(mode){document.documentElement.classList.toggle("dark",mode==="dark");const b=document.querySelector("#theme-toggle");if(b){b.textContent=mode==="dark"?"☀️ โหมดสว่าง":"🌙 โหมดมืด";b.setAttribute("aria-pressed",String(mode==="dark"));}}
let savedTheme="light";try{savedTheme=localStorage.getItem(themeKey)||"light"}catch(e){}
applyTheme(savedTheme);

$("#fav").href=$("#logo").src;
const esc = t => String(t??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const isEd = () => !!S.user && S.isAdmin;
const baht = n => Number(n||0).toLocaleString("th-TH")+" บาท";
const today = () => {const d=new Date();d.setHours(0,0,0,0);return d};
const fmt = s => s? new Date(s+"T00:00").toLocaleDateString("th-TH",{day:"numeric",month:"short",year:"2-digit"}):"-";
const toast = m => {const t=$("#toast");t.textContent=m;t.style.display="block";setTimeout(()=>t.style.display="none",2500)};
const guard = fn => async (...a)=>{try{await fn(...a)}catch(e){toast("ทำไม่สำเร็จ: "+(e.code||e.message))}};

/* ---------- realtime data ---------- */
const sub = (name,key,ord) => onSnapshot(collection(db,name),snap=>{
  S[key]=snap.docs.map(d=>({id:d.id,...d.data()})).sort(ord||(()=>0));
  if(["pays","rounds","students","debts"].includes(key)) checkReminder();
  if(S.debtOpen&&["debts","pays","rounds","students"].includes(key)) debtModal(S.debtOpen);
  render();
},e=>toast("อ่านข้อมูลไม่ได้: "+e.code));
// Public classroom information: no sign-in required.
sub("homework","hw",(a,b)=>(a.due||"").localeCompare(b.due||""));
sub("events","ev",(a,b)=>(a.start||"").localeCompare(b.start||""));
onSnapshot(doc(db,"settings","site"),d=>{const l=d.data()?.logo;if(l){$("#logo").src=l;$("#fav").href=l}},e=>console.warn("Public settings unavailable",e.code));
// Keep the existing classroom workflow: student profiles and room-payment status
// are loaded for the current UI; writes remain restricted by Firestore Rules.
let unAdm=null, publicClassUnsubs=[];
publicClassUnsubs.push(sub("students","students",(a,b)=>(a.sid||"").localeCompare(b.sid||"")));
publicClassUnsubs.push(sub("rounds","rounds",(a,b)=>(a.due||"").localeCompare(b.due||"")));
publicClassUnsubs.push(sub("debts","debts",(a,b)=>(a.date||"").localeCompare(b.date||"")));
publicClassUnsubs.push(sub("payments","pays"));
// Read aggregate source data for the classroom balance (the student UI only shows the total).
publicClassUnsubs.push(sub("ledger","ledger",(a,b)=>(b.date||"").localeCompare(a.date||"")));
let privateUnsubs=[];
function clearPrivateData(){privateUnsubs.forEach(u=>u());privateUnsubs=[];S.admins=[];}
onAuthStateChanged(auth,async u=>{S.user=u;S.isAdmin=false;
  if(u && u.email){try{S.isAdmin=(await getDoc(doc(db,"admins",u.email.toLowerCase()))).exists()}catch(e){S.isAdmin=false;}}
  if(unAdm){unAdm();unAdm=null;}
  clearPrivateData();
  if(S.isAdmin){
    unAdm=onSnapshot(collection(db,"admins"),sn=>{S.admins=sn.docs.map(d=>d.id).sort();if(S.admOpen)adminModal()},e=>toast("อ่านรายชื่อผู้ดูแลไม่ได้: "+e.code));
  }
  if(S.isAdmin && S.coursesLoaded && !S.courses.length) seedDefaultCourses();
  if(!S.isAdmin && S.tab==="mo") S.tab="dash";
  render();
});

/* ---------- status ---------- */
function status(due){
  if(!due) return {k:"blue",t:"ไม่ระบุ",o:5};
  const d=Math.round((new Date(due+"T00:00")-today())/864e5);
  if(d<0) return {k:"red",t:"หมดเขต",o:0};
  if(d===0) return {k:"o",t:"ส่งวันนี้!",o:1};
  if(d<=3) return {k:"y",t:"อีก "+d+" วัน",o:2};
  if(d<=7) return {k:"green",t:"อีก "+d+" วัน",o:3};
  return {k:"blue",t:"อีก "+d+" วัน",o:4};
}
const FILTERS=[["all","ทั้งหมด"],["pin","📌 ปักหมุด"],["done","✅ เสร็จแล้ว"],["blue","🔵 >7 วัน"],["green","🟢 ใน 7 วัน"],["y","🟡 ใน 3 วัน"],["o","🟠 วันนี้"],["red","🔴 หมดเขต"]];

/* ---------- header ---------- */
function renderWho(){
  const w=$("#who");let h="";

function rstate(r,st){
  if(st==="paid"||st==="pending") return st;
  const t=today();
  if(new Date(rs(r)+"T00:00")>t) return "wait";
  return r.due&&new Date(r.due+"T00:00")<t?"late":"due";
}
function roundInfo(r){
  const t=today(),d=x=>Math.round((new Date(x+"T00:00")-t)/864e5);
  if(rs(r)&&d(rs(r))>0) return "🕒 เริ่มชำระอีก "+d(rs(r))+" วัน";
  if(!r.due) return "";const n=d(r.due);
  return n<0?"🚨 เกินกำหนด "+(-n)+" วัน":n===0?"🟠 ครบกำหนดวันนี้":"⏰ เหลือเวลา "+n+" วัน";
}

function parseStu(l){
  l=l.trim().replace(/[，\t]/g,",");if(!l) return null;
  if(l.includes(",")){const [sid,...r]=l.split(",").map(x=>x.trim()),t=r.filter(Boolean);
    if(t.length>=2) return {sid,nick:t[0],name:t.slice(1).join(" ")};
    const w=(t[0]||"").split(/\s+/);return {sid,nick:w[0]||"",name:w.slice(1).join(" ")}}
  const w=l.split(/\s+/);return {sid:w[0],nick:w[1]||"",name:w.slice(2).join(" ")};
}

/* ---------- debts ---------- */
function owedOf(sid){
  const rounds=S.rounds.map(r=>({r,k:rstate(r,payOf(r.id,sid))})).filter(x=>x.k==="due"||x.k==="late"||x.k==="pending");
  const debts=S.debts.filter(d=>d.sid===String(sid)&&!d.paid),sum=a=>a.reduce((t,x)=>t+Number(x||0),0);
  return {rounds,debts,total:sum(rounds.filter(x=>x.k!=="pending").map(x=>x.r.amount))+sum(debts.map(d=>d.amount)),pend:sum(rounds.filter(x=>x.k==="pending").map(x=>x.r.amount))};
}
function viewDebt(){
  const ms=S.msearch.toLowerCase(),rows=S.students.filter(s=>isEd()||String(s.sid)===String(S.student?.sid)).map(s=>({s,o:owedOf(s.sid)}));
  const tot=rows.reduce((a,x)=>a+x.o.total,0),ppl=rows.filter(x=>x.o.total>0).length,mine=S.student&&rows.find(x=>String(x.s.sid)===String(S.student.sid));
  const list=rows.filter(x=>isEd()?(!ms||[x.s.sid,x.s.nick,x.s.name].some(v=>String(v||"").toLowerCase().includes(ms))):true).sort((a,b)=>b.o.total-a.o.total||String(a.s.sid).localeCompare(String(b.s.sid)));
  return `${mine?`<div class="card mem ${mine.o.total?"due":"paid"}" data-debt="${mine.s.sid}" tabindex="0" role="button"><span class="hm">${mascot(mine.o.total?"sad":"cheer",76)}</span><div class="mp"><div class="meta">ยอดค้างของฉัน</div><div class="nm big">${mine.o.total?baht(mine.o.total):"🎉 ไม่มียอดค้าง"}</div><div class="meta">แตะเพื่อดูว่าค้างรอบไหนบ้าง</div></div></div>`:""}
  ${isEd()?`<div class="card sum"><div>ยอดค้างรวมทั้งห้อง<b class="bad">${baht(tot)}</b></div><div>คนที่ค้าง<b>${ppl} คน</b></div></div>`:""}
  <div class="card">${isEd()?`<div class="row"><input id="ms" class="grow" placeholder="🔍 ชื่อเล่น / ชื่อจริง / รหัส" value="${esc(S.msearch)}"></div>`:""}<p class="meta" style="margin:8px 0 0">${isEd()?"แตะที่ชื่อเพื่อดูรายละเอียดรอบที่ค้าง · เพิ่มยอดค้าง / รับชำระทั้งหมด":"แสดงเฉพาะยอดค้างของคุณ"}</p></div>
  ${list.map(({s,o})=>{const nm=[...o.rounds.filter(x=>x.k!=="pending").map(x=>esc(x.r.title)),...(o.debts.length?["ยอดพิเศษ"]:[])];
   return `<div class="mem ${o.total?"due":"paid"}" data-debt="${s.sid}" tabindex="0" role="button"><div class="mp"><div class="nm">${esc(s.nick||s.name)}</div><div class="meta">${esc(s.name)} · รหัส ${esc(s.sid)}</div>${nm.length?`<div class="meta">ค้าง: ${nm.join(", ")}</div>`:""}</div><span class="st">${o.total?baht(o.total):"✅ ไม่ค้าง"}</span></div>`}).join("")||'<div class="card meta">ไม่พบสมาชิก</div>'}`;

function debtModal(sid){

   ${o.rounds.map(x=>row("📅 "+esc(x.r.title),"หมดเขต "+fmt(x.r.due)+(x.k==="late"?" · 🚨 เกินกำหนด":"")+(x.k==="pending"?" · ⏳ รออนุมัติ (ยังไม่รวมในยอดค้าง)":""),x.r.amount)).join("")}
   ${o.debts.map(d=>row("📝 "+esc(d.note||"ยอดค้างพิเศษ"),"เพิ่มเมื่อ "+fmt(d.date),d.amount,isEd()?`<button class="sm dng" data-ddel="${d.id}">ลบ</button>`:"")).join("")}

    <div style="text-align:center;margin-top:10px"><button class="pri" id="d-pay" ${o.total?"":"disabled"}>💵 รับชำระทั้งหมด ${baht(o.total)}</button><p class="meta">ล้างทุกรอบที่ค้าง + ยอดพิเศษ และบันทึกเป็นรายรับครั้งเดียว</p></div>`:""}
   <div style="text-align:center;margin-top:8px"><button id="cl">ปิด</button></div></div>`);

    await addDoc(collection(db,"debts"),{sid:String(s.sid),amount:a,note:$("#d-n").value.trim(),date:iso(new Date()),paid:false});toast("เพิ่มยอดค้างแล้ว")}));
  document.querySelectorAll("[data-ddel]").forEach(b=>b.onclick=guard(async()=>{if(confirm("ลบยอดค้างนี้?"))await deleteDoc(doc(db,"debts",b.dataset.ddel))}));
  $("#d-pay")?.addEventListener("click",guard(async()=>{
    const due=o.rounds.filter(x=>x.k!=="pending");if(!o.total) return;
    if(!confirm(`รับชำระ ${baht(o.total)} จาก ${s.nick||s.name} (${due.length} รอบ${o.debts.length?` + ยอดพิเศษ ${o.debts.length} รายการ`:""}) และบันทึกเป็นรายรับ?`)) return;

    due.forEach(x=>b.set(doc(db,"payments",x.r.id+"_"+s.sid),{round:x.r.id,sid:String(s.sid),status:"paid",ledgered:true,at:serverTimestamp()}));

    b.set(doc(collection(db,"ledger")),{type:"in",name:`ชำระยอดค้างรวม ${s.nick||s.name} (${due.length} รอบ${o.debts.length?` + ยอดพิเศษ ${o.debts.length}`:""})`,amount:o.total,date:iso(new Date())});
    await b.commit();toast("รับชำระและบันทึกรายรับแล้ว ✅");}));
}

   ${isEd()?`<button class="dash-stat stat-green" id="dash-stat-money"><span class="stat-icon">💰</span><span class="stat-label">เงินห้องคงเหลือ</span><strong class="money-number">${balance.toLocaleString("th-TH")}<small>฿</small></strong><span class="stat-foot">รับ ${inc.toLocaleString("th-TH")} · จ่าย ${exp.toLocaleString("th-TH")} <b>↗</b></span><span class="stat-coin">฿</span></button>`:""}
  </section>
  <section class="dash-main-grid"><div class="dash-panel dash-progress-panel"><div class="panel-head"><div><span class="dash-eyebrow">YOUR PROGRESS</span><h3>ความคืบหน้าการบ้าน</h3></div><span class="dash-round-icon">✧</span></div><div class="progress-overview"><div class="progress-ring" style="--progress:${pct}%"><div><strong>${pct}<small>%</small></strong><span>เสร็จแล้ว</span></div></div><div class="progress-copy"><strong>${finished} <small>/ ${hw.length} งาน</small></strong><p>${hw.length?(pct===100?"สุดยอด! เคลียร์ทุกงานแล้ว 🎉":"ค่อย ๆ ทำไป คุณทำได้แน่นอน") :"เพิ่มการบ้านเพื่อเริ่มติดตามความคืบหน้า"}</p><div class="progress-legend"><span><i class="legend-done"></i> เสร็จแล้ว <b>${finished}</b></span><span><i class="legend-open"></i> ยังไม่เสร็จ <b>${open}</b></span></div></div></div><div class="dash-progress-bar"><span style="width:${pct}%"></span></div><button class="dash-text-link" id="dash-progress-link">ดูการบ้านทั้งหมด <b>→</b></button></div>
  <div class="dash-panel dash-events-panel"><div class="panel-head"><div><span class="dash-eyebrow">UP NEXT</span><h3>กิจกรรมใกล้เข้ามา</h3></div><button class="dash-icon-btn" id="dash-go-ca" aria-label="เปิดปฏิทิน">↗</button></div>${events.length?`<div class="dash-event-list">${events.map((e,i)=>`<div class="dash-event-row"><div class="event-date"><b>${e.start?new Date(e.start+"T00:00").getDate():"—"}</b><span>${e.start?new Date(e.start+"T00:00").toLocaleDateString("en-US",{month:"short"}).toUpperCase():"DATE"}</span></div><div class="event-copy"><b>${e.type==="holiday"?"🔴 ":"✦ "}${esc(e.title||"กิจกรรม")}</b><span>${esc(period(e))}</span></div><span class="event-index">0${i+1}</span></div>`).join("")}</div>`:`<div class="dash-empty"><span>🌤️</span><b>ยังไม่มีรายการใกล้เข้ามา</b><small>เพิ่มวันสำคัญหรือกิจกรรมได้ที่ปฏิทิน</small></div>`}<button class="dash-text-link" id="dash-calendar-link">เปิดปฏิทิน <b>→</b></button></div></section>
  <section class="dash-bottom-grid"><div class="dash-panel"><div class="panel-head"><div><span class="dash-eyebrow">NEEDS ATTENTION</span><h3>งานที่ควรโฟกัส</h3></div><span class="attention-count">${late.length+dueSoon.length} รายการ</span></div>${[...late,...dueSoon].slice(0,4).length?[...late,...dueSoon].slice(0,4).map(h=>`<div class="dash-task-row"><span class="task-mark ${h.due<t?"task-late":"task-soon"}">${h.due<t?"!":"↗"}</span><div class="task-copy"><b>${esc(h.subject||"การบ้าน")} · ${esc(h.title||"ไม่มีชื่อ")}</b><small>${h.due<t?`เลยกำหนด ${fmt(h.due)}`:`ส่ง ${fmt(h.due)}`}</small></div><span class="task-badge ${h.due<t?"badge-late":"badge-soon"}">${h.due<t?"เลยกำหนด":h.st.t}</span></div>`).join(""):`<div class="dash-empty compact"><span>✨</span><b>ไม่มีงานเร่งด่วน</b><small>เยี่ยมมาก รักษาจังหวะนี้ไว้!</small></div>`}<button class="dash-text-link" id="dash-focus-link">จัดการการบ้าน <b>→</b></button></div>
  ${isEd()?`<div class="dash-panel dash-money-panel"><div class="panel-head"><div><span class="dash-eyebrow">CLASS FUND</span><h3>เงินกองกลางห้อง</h3></div><span class="dash-round-icon">฿</span></div><div class="money-balance-label">ยอดคงเหลือโดยประมาณ</div><div class="money-balance">${baht(balance)}</div><div class="money-mini-grid"><div><span>รายรับรวม</span><b class="ok">+${inc.toLocaleString("th-TH")} ฿</b></div><div><span>รายจ่ายรวม</span><b class="bad">−${exp.toLocaleString("th-TH")} ฿</b></div></div><div class="money-note">${unpaid?`<span class="money-alert">●</span> มี ${unpaid} รายการชำระที่ยังไม่ครบ`: `<span class="money-safe">●</span> ไม่มีรายการค้างที่ถึงกำหนดในข้อมูลปัจจุบัน`}</div><button class="dash-text-link" id="dash-money-link">ดูรายละเอียดเงินห้อง <b>→</b></button></div>`:""}</section>
  <div class="dash-footer-note"><span>✦</span><div><b>Better together.</b><small>จัดการเรื่องในห้องเรียนให้ง่ายขึ้น ในที่เดียว</small></div><span class="dash-footer-mark">GETHERCLASS / 01</span></div>`;
}

/* ---------- render ---------- */
function render(){
  const a=document.activeElement?.id;
  const canSeeMoney=isEd()||!!S.student;
  $("#t-mo").classList.toggle("hide",!canSeeMoney);
  $("#t-mo").setAttribute("aria-hidden",String(!canSeeMoney));
  if(!canSeeMoney && S.tab==="mo") S.tab="dash";
  ["dash","hw","ca","mo"].forEach(k=>$("#t-"+k).classList.toggle("on",S.tab===k));
  renderWho();
  $("#app").classList.toggle("enter",S._lt!==S.tab);S._lt=S.tab;
  $("#app").innerHTML=S.tab==="dash"?viewDashboard():S.tab==="hw"?viewHW():S.tab==="ca"?viewCA():viewMO();
  if(S.tab==="hw")bindHW();else if(S.tab==="ca")bindCA();else if(S.tab==="mo")bindMO();else bindDashboard();
}
function bindDashboard(){
  const go=(tab)=>{S.tab=tab;render();window.scrollTo({top:0,behavior:"smooth"})};
  ["dash-go-hw","dash-stat-hw","dash-stat-late","dash-progress-link","dash-focus-link"].forEach(id=>$("#"+id)?.addEventListener("click",()=>{if(id==="dash-stat-late")S.f="red";else S.f="all";go("hw")}));
  ["dash-stat-events","dash-go-ca","dash-calendar-link"].forEach(id=>$("#"+id)?.addEventListener("click",()=>go("ca")));
  ["dash-stat-money","dash-money-link"].forEach(id=>$("#"+id)?.addEventListener("click",()=>go("mo")));
}
$("#theme-toggle").onclick=()=>{const next=document.documentElement.classList.contains("dark")?"light":"dark";applyTheme(next);try{localStorage.setItem(themeKey,next)}catch(e){}};
$("#t-dash").onclick=()=>{S.tab="dash";render()};$("#t-hw").onclick=()=>{S.tab="hw";render()};$("#t-ca").onclick=()=>{S.tab="ca";render()};$("#t-mo").onclick=()=>{if(!isEd()&&!S.student){toast("กรุณาเข้าสู่ระบบนักเรียนก่อน");return}if(!isEd())S.moTab="status";S.tab="mo";render()};
$("#ft").innerHTML=mascot("happy",54)+"<span>Getherclass · ห้องเรียนของเรา</span>";
render();
</script>
</body>
</html>
